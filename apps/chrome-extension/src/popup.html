<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nuoma Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Geist", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #081416;
        color: #f3faf7;
      }
      body {
        width: 336px;
        margin: 0;
        background:
          radial-gradient(circle at 18% 0%, rgba(159, 205, 189, 0.18), transparent 38%),
          linear-gradient(155deg, #10252a 0%, #081416 68%);
      }
      main {
        display: grid;
        gap: 14px;
        padding: 16px;
      }
      .brand {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 12px;
        align-items: center;
      }
      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgba(159, 205, 189, 0.34);
        border-radius: 14px;
        background:
          linear-gradient(145deg, rgba(143, 181, 216, 0.24), rgba(159, 205, 189, 0.14)),
          rgba(7, 20, 23, 0.82);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 14px 30px rgba(0, 0, 0, 0.28);
        color: #f3faf7;
        font-size: 18px;
        font-weight: 800;
        line-height: 1;
      }
      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }
      h1 {
        font-size: 17px;
        line-height: 1.15;
      }
      h2 {
        font-size: 11px;
        font-weight: 700;
        color: #9fcdbd;
        text-transform: uppercase;
      }
      .lede {
        margin-top: 4px;
        color: #b5c8c5;
        font-size: 12px;
        line-height: 1.35;
      }
      .panel {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        background: rgba(10, 25, 27, 0.76);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: #d9eee6;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 22px;
        padding: 0 8px;
        border: 1px solid rgba(159, 205, 189, 0.24);
        border-radius: 999px;
        color: #9fcdbd;
        background: rgba(159, 205, 189, 0.08);
        white-space: nowrap;
      }
      .chip::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #9fcdbd;
        box-shadow: 0 0 12px rgba(159, 205, 189, 0.48);
      }
      label {
        display: grid;
        gap: 7px;
        color: #d9eee6;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      input {
        min-width: 0;
        border: 1px solid rgba(159, 205, 189, 0.26);
        border-radius: 10px;
        background: rgba(4, 13, 14, 0.9);
        color: #f3faf7;
        font: inherit;
        padding: 10px 11px;
        outline: none;
      }
      input:focus {
        border-color: rgba(159, 205, 189, 0.62);
        box-shadow: 0 0 0 3px rgba(159, 205, 189, 0.14);
      }
      button {
        min-height: 36px;
        border: 1px solid rgba(159, 205, 189, 0.32);
        border-radius: 10px;
        background: rgba(159, 205, 189, 0.14);
        color: #f3faf7;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        border-color: rgba(159, 205, 189, 0.58);
        background: rgba(159, 205, 189, 0.2);
      }
      button.primary {
        background: #9fcdbd;
        border-color: #9fcdbd;
        color: #071417;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row button {
        flex: 1;
      }
      .status {
        border: 1px solid rgba(143, 181, 216, 0.24);
        border-radius: 10px;
        background: rgba(5, 12, 14, 0.72);
        padding: 10px 11px;
        color: #d9eee6;
        font-size: 12px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark" aria-hidden="true">N</div>
        <div>
          <h2>Extensão local</h2>
          <h1>Nuoma Overlay</h1>
          <p class="lede">Painel seguro no WhatsApp Web.</p>
        </div>
      </div>
      <div class="panel">
        <div class="meta">
          <span>Bridge da API</span>
          <span class="chip">Leitura</span>
        </div>
        <label>
          API local
          <input id="apiBaseUrl" value="http://127.0.0.1:3001" />
        </label>
        <div class="row">
          <button id="save" class="primary" type="button">Salvar</button>
          <button id="openWhatsApp" type="button">WhatsApp</button>
        </div>
        <div id="status" class="status">Aguardando Chrome Extension runtime.</div>
      </div>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
