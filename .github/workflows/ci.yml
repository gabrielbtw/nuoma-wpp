name: CI

on:
  push:
    branches:
      - main
      - nuoma-wpp-v2
      - "if-01/**"
      - "codex/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm run test

      - name: Critical Messaging Reliability Tests
        run: |
          npm run test --workspace @nuoma/api -- src/services/extension-overlay.test.ts src/services/automation-engine-daemon.test.ts
          npm run test --workspace @nuoma/db -- src/contact-identity-backfill.test.ts src/repositories.test.ts -t "wa_jid|worker send token buckets|serial"
          npm run test --workspace @nuoma/worker -- src/sync/handler.test.ts -t "saved-name|wa_jid|canonical identity|canonical"
          npm run test --workspace @nuoma/worker -- src/job-loop.test.ts -t "Instagram|token bucket|24h|canonical wa_jid|rate"
          npm run test --workspace @nuoma/worker -- src/instagram/guard.test.ts src/instagram/assisted.test.ts src/voice/audio.test.ts
          npm run test:contact-identity-raw-sql
